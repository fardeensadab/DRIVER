---

# Local install patch: refresh CA certificates and apt sources on the old
# Ubuntu 14.04 VMs before anything is downloaded.
- hosts: all
  become: True
  roles:
    - { role: "driver.compat" }

# Installs packages/dependencies for web servers

- hosts: all

  pre_tasks:
    - name: Gather EC2 facts
      action: ec2_facts
      when: staging

- hosts: celery-servers

  become: True

  vars:
    celery: True

  pre_tasks:
    - name: Add Docker APT key via curl
      shell: "curl -sSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -"

    - name: Update APT cache
      apt: update_cache=yes

  roles:
    - { role: "driver.gradle" }
    - { role: "driver.celery" }
    - { role: "driver-celery.nginx" }
    - { role: "driver.r-docker" }
