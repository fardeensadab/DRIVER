---
# Local install patch: no signing key needed - packages come from the local,
# checksum-verified mirror built by driver.compat (see the repository line below).

- name: Configure the PostgreSQL APT repositories
  apt_repository: repo="deb [trusted=yes] file:/var/cache/pgdg-mirror trusty-pgdg main"
                  state=present

- name: Install PostGIS
  apt: pkg={{ item }} state=present
  with_items:
    - postgresql-{{ postgresql_version }}-postgis-{{ postgis_version }}={{ postgis_package_version }}
