---
# Local install patch: no signing key needed - packages come from the local,
# checksum-verified mirror built by driver.compat (see the repository line below).

- name: Configure the PostgreSQL APT repositories
  apt_repository: repo="deb [trusted=yes] file:/var/cache/pgdg-mirror trusty-pgdg main"
                  state=present

- name: Install client API libraries for PostgreSQL
  apt: pkg=libpq-dev={{ postgresql_support_libpq_version }}
       state=present

- name: Install PostgreSQL driver for Python
  # Local install patch: install from the local directory filled by driver.compat
  pip: name=psycopg2
       version={{ postgresql_support_psycopg2_version }}
       state=present
       extra_args="--no-index --find-links=/var/cache/pip-local"
