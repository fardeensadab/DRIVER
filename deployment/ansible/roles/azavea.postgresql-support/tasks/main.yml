---
- name: Configure the PostgreSQL APT key
  # Local install patch: curl instead of apt_key url= (Python 2.7.6 lacks TLS SNI)
  shell: curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | apt-key add -
  args:
    warn: false
  changed_when: false

- name: Configure the PostgreSQL APT repositories
  apt_repository: repo="deb [trusted=yes] file:/var/cache/pgdg-mirror trusty-pgdg main"
                  state=present

- name: Install client API libraries for PostgreSQL
  apt: pkg=libpq-dev={{ postgresql_support_libpq_version }}
       state=present

- name: Install PostgreSQL driver for Python
  pip: name=psycopg2
       version={{ postgresql_support_psycopg2_version }}
       state=present
