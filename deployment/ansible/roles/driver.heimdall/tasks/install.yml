---
- name: Download Heimdall
  # Local install patch: curl instead of get_url (Python 2.7.6 lacks TLS SNI)
  shell: >
    curl -fsSL -o /tmp/heimdall.tar.gz
    "https://github.com/hectcastro/heimdall/releases/download/{{ heimdall_version }}/linux_amd64_heimdall.tar.gz"
  args:
    creates: /tmp/heimdall.tar.gz
    warn: false

- name: Expand Heimdall
  unarchive: src="/tmp/heimdall.tar.gz" dest=/tmp/ copy=no creates=/tmp/heimdall

- name: Install Heimdall
  command: cp /tmp/heimdall {{ heimdall_install_path }} creates={{ heimdall_install_path }}
  register: heimdall_install
