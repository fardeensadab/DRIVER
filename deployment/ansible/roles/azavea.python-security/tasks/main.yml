---
- name: Install Python TLS SNI dependencies
  # Local install patch: install from the local directory filled by driver.compat
  pip: name={{ item.name }}=={{ item.version }} state=present extra_args="--no-index --find-links=/var/cache/pip-local"
  with_items:
    - { name: ndg-httpsclient, version: "{{ python_security_ndghttpsclient_version }}" }
    - { name: pyasn1, version: "{{ python_security_pyasn1_version }}" }
